name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS - native runners
          - target: x86_64-apple-darwin
            host: macos-latest
          - target: aarch64-apple-darwin
            host: macos-latest
          # Linux gnu - napi-cross
          - target: x86_64-unknown-linux-gnu
            host: ubuntu-latest
            extra-args: '--use-napi-cross'
          - target: aarch64-unknown-linux-gnu
            host: ubuntu-latest
            extra-args: '--use-napi-cross'
          # Linux musl - cargo-zigbuild
          - target: x86_64-unknown-linux-musl
            host: ubuntu-latest
            extra-args: '-x'
          - target: aarch64-unknown-linux-musl
            host: ubuntu-latest
            extra-args: '-x'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup (Linux Cross-Compilation)
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux

      - name: Build native binding (${{ matrix.target }})
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            export DEVELOPER_DIR="$(env -u DEVELOPER_DIR /usr/bin/xcode-select -p)"
            export SDKROOT="$(env -u SDKROOT /usr/bin/xcrun --sdk macosx --show-sdk-path)"
            export CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER=/usr/bin/clang
            export CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER=/usr/bin/clang
          fi
          pnpm exec napi build --release --platform --esm --strip \
            --output-dir dist/napi/ \
            --target "${{ matrix.target }}" ${{ matrix.extra-args }}
        env:
          MACOSX_DEPLOYMENT_TARGET: '10.13'
          TARGET_CFLAGS: '-std=gnu11 -UNDEBUG'

      - name: Upload native binding
        uses: actions/upload-artifact@v4
        with:
          name: native-binding-${{ matrix.target }}
          path: dist/napi/
          if-no-files-found: error

  test-binding:
    needs: build
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            host: macos-latest
            node-arch: x64
          - target: aarch64-apple-darwin
            host: macos-latest
            node-arch: arm64
          - target: x86_64-unknown-linux-gnu
            host: ubuntu-latest
            image: node:24-slim
          - target: aarch64-unknown-linux-gnu
            host: ubuntu-24.04-arm
            image: node:24-slim
          - target: x86_64-unknown-linux-musl
            host: ubuntu-latest
            image: node:24-alpine
          - target: aarch64-unknown-linux-musl
            host: ubuntu-24.04-arm
            image: node:24-alpine
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download native binding
        uses: actions/download-artifact@v4
        with:
          name: native-binding-${{ matrix.target }}
          path: dist/napi

      - name: Setup Node (macOS)
        if: runner.os == 'macOS'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: ${{ matrix.node-arch }}

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: node tests/smoke.ts

      - name: Smoke test (Linux, ${{ matrix.image }})
        if: runner.os == 'Linux'
        run: docker run --rm -v "$PWD":/w -w /w ${{ matrix.image }} node tests/smoke.ts

  release:
    needs: [build, test-binding]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download native bindings
        uses: actions/download-artifact@v4
        with:
          pattern: native-binding-*
          path: dist/napi
          merge-multiple: true

      - name: Stage platform packages
        run: |
          pnpm exec napi create-npm-dirs
          pnpm exec napi artifacts -d dist/napi --npm-dir npm

      - name: Build JavaScript
        run: pnpm run build:js

      - name: Run Nix flake checks
        run: nix flake check

      - name: Lint
        run: pnpm run lint

      - name: Run JavaScript tests
        run: pnpm test

      - name: Semantic Release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
